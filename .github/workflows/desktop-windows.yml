name: Build Windows Desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-windows.yml'
      - 'desktop/**'
      - 'package.json'
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm run check
      - name: Build unsigned x64 installer
        run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: magnexis-voice-v1.25.0-windows-unsigned
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
